<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>編み図メーカー</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c4577a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="編み図">
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2622;--sub:#7a6f66;--line:#e5dcd2;--accent:#c4577a;--accent2:#f6e3ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:18px;margin:0;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;font:inherit;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fffdfb}
.row h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.row h3 .cnt{font-weight:400;color:var(--sub);font-size:12px;margin-right:auto}
.entry{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.entry select{flex:1;min-width:0}
.entry input{width:64px}
select,input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button.b{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--ink)}
button.b:hover{background:var(--accent2)}
button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
button.p:hover{background:#a8456a}
.x{padding:5px 8px!important;color:var(--sub)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
#chartWrap{overflow:auto;text-align:center;background:#fff;border-radius:8px}
#chartWrap svg{max-width:none}
#chartWrap svg.fit{max-width:100%;height:auto}
#bagOpt{display:none;margin-bottom:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffdfb;font-size:14px}
#bagOpt label{display:block;margin-top:8px}
#bagOpt input[type=text],#bagOpt textarea{width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px}
#bagOpt input[type=number]{width:70px}
.rowopt{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:13px;color:var(--sub)}
.rowopt input{width:60px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.recipe{margin:10px 0 0;padding-left:0;list-style:none;font-size:14px;line-height:1.7}
.group{border:1px dashed var(--accent);border-radius:8px;padding:8px;margin-bottom:6px;background:var(--accent2)}
.gh{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.gh input{width:64px}
.gh button{margin-left:auto}
.gi{margin-bottom:6px}
#ovalOpt{display:none;margin-bottom:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffdfb;font-size:14px}
#ovalOpt label{display:flex;gap:6px;align-items:center;margin-top:8px}
#ovalOpt input{width:70px}
.hint{color:var(--sub);font-size:12px;margin:4px 0 0}
</style>
</head>
<body>
<header>
  <h1>🧶 編み図メーカー</h1>
  <div class="seg" id="modeSeg"><button data-v="crochet">かぎ針</button><button data-v="knit">棒針</button></div>
  <div class="seg" id="layoutSeg"><button data-v="flat">平編み</button><button data-v="round">円形</button><button data-v="oval">楕円(袋の底)</button><button data-v="bag">袋物(底+側面)</button></div>
</header>
<main>
  <section>
    <div class="card">
      <div id="bagOpt">
        <label>底の段数(楕円で描く段数。鎖の段も含む) <input type="number" id="baseRows" min="1" max="50"></label>
        <label>メモ(右側に表示。改行できます)<textarea id="memo" rows="3" placeholder="例: 鎖24目作る。各段合計50目編む。(増減なし)"></textarea></label>
        <label>クレジット(右下に表示)<input type="text" id="credit" placeholder="例: @your_name"></label>
      </div>
      <div id="ovalOpt">
        <button class="b p" id="bagPreset">袋の底をつくる</button>
        <p class="hint">鎖の目数を入れると、1段目=鎖、2段目=鎖の上下を細編みで1周する段、を自動で作ります(今の段は置き換わります)。</p>
        <label>直線部分の目数(片側) <input type="number" id="ovalP" min="1" placeholder="自動"></label>
      </div>
      <div id="rows"></div>
      <div class="tools">
        <button class="b p" id="addRow">＋ 段を追加</button>
        <button class="b" id="reset">リセット</button>
      </div>
      <p class="hint">段ごとに編み目の種類と目数を入力すると、編み図ができます。自動でブラウザに保存されます。</p>
    </div>
  </section>
  <section>
    <div class="card">
      <div class="tools" style="margin-bottom:10px;justify-content:space-between">
        <strong>編み図</strong>
        <button class="b" id="png">PNGで保存</button>
      </div>
      <div id="chartWrap"></div>
      <div class="legend" id="legend"></div>
      <ul class="recipe" id="recipe"></ul>
    </div>
  </section>
</main>

<script>
// ---------- 編み目の定義 ----------
const S = '#2b2622', SW = 2;
const ln = (a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
const T = ln(-8,-14,8,-14)+ln(0,-14,0,14);
const xmark = (cx,cy,r)=>ln(cx-r,cy-r,cx+r,cy+r)+ln(cx-r,cy+r,cx+r,cy-r);
const drop = '<path d="M0,14 C-11,4 -9,-14 0,-14 C9,-14 11,4 0,14Z" fill="#fff"/>';
const STITCHES = {
  crochet:[
    {id:'chain', name:'鎖編み', out:1, svg:'<ellipse cx="0" cy="0" rx="6" ry="10" fill="none"/>'},
    {id:'slip',  name:'引き抜き編み', out:1, svg:'<circle cx="0" cy="0" r="4" fill="'+S+'"/>'},
    {id:'turn',  name:'立ち上がり(鎖)', out:1, svg:'<ellipse cx="0" cy="0" rx="6" ry="10" fill="none"/>'},
    {id:'sc',    name:'細編み', out:1, svg:xmark(0,0,8)},
    {id:'hdc',   name:'中長編み', out:1, svg:T},
    {id:'dc',    name:'長編み', out:1, svg:T+ln(-5,1,5,-5)},
    {id:'tr',    name:'長々編み', out:1, svg:T+ln(-5,3,5,-3)+ln(-5,-3,5,-9)},
    {id:'inc',   name:'細編み2目編み入れ(増し目)', out:2, svg:ln(0,14,-8,-2)+ln(0,14,8,-2)+xmark(-8,-7,5)+xmark(8,-7,5)},
    {id:'dec',   name:'細編み2目一度(減らし目)', out:1, svg:'<g transform="scale(1,-1)">'+ln(0,14,-8,-2)+ln(0,14,8,-2)+xmark(-8,-7,5)+xmark(8,-7,5)+'</g>'},
    {id:'bobble',name:'玉編み', out:1, svg:drop+ln(-4,-8,4,-11)+ln(-4,-2,4,-5)+ln(-4,4,4,1)},
    {id:'backsc',name:'バック細編み', out:1, svg:xmark(0,5,6)+'<path d="M-8,-8 Q-4,-15 0,-9 T8,-9" fill="none"/>'},
    {id:'popcorn',name:'ポップル編み', out:1, svg:'<path d="M0,14 C-11,4 -9,-14 0,-14 C9,-14 11,4 0,14Z" fill="#555"/>'+ln(-5,-6,5,-6)+ln(0,-6,0,14)}
  ],
  knit:[
    {id:'knit',  name:'表目', out:1, svg:ln(0,-12,0,12)},
    {id:'purl',  name:'裏目', out:1, svg:ln(-9,0,9,0)},
    {id:'yo',    name:'かけ目', out:1, svg:'<circle cx="0" cy="0" r="6" fill="none"/>'},
    {id:'k2tog', name:'右上2目一度', out:1, svg:ln(-8,12,8,-12)},
    {id:'ssk',   name:'左上2目一度', out:1, svg:ln(-8,-12,8,12)},
    {id:'bo',    name:'伏せ目', out:1, svg:'<path d="M-8,8 L-8,-4 A8,8 0 0 1 8,-4 L8,8" fill="none"/>'},
    {id:'cast',  name:'作り目(巻き目)', out:1, svg:'<path d="M-8,8 A8,8 0 1 1 8,8" fill="none"/>'}
  ]
};
const byId = (mode,id)=>STITCHES[mode].find(s=>s.id===id) || STITCHES[mode][0];
const sym = (s,tf)=>`<g transform="${tf}" stroke="${S}" stroke-width="${SW}" stroke-linecap="round" stroke-linejoin="round" fill="none">${s.svg}</g>`;

// ---------- 状態 ----------
const KEY='knit-app-v1';
const COLORS=[['','なし'],['#d4f0a8','緑'],['#fff27a','黄'],['#ffd1dc','ピンク'],['#cde7ff','水色'],['#e6d9ff','紫'],['#ffe0b3','橙'],['#e8e8e8','グレー']];
const defaults = ()=>({mode:'crochet',layout:'flat',ovalP:null,baseRows:2,memo:'',credit:'',data:{
  crochet:[{items:[{t:'chain',n:9}]},{items:[{t:'sc',n:9}]}],
  knit:[{items:[{t:'cast',n:9}]},{items:[{t:'knit',n:9}]}]
}});
let st; try{ st=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
st = (st&&st.data)? Object.assign(defaults(),st) : defaults();
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){} };
const rows=()=>st.data[st.mode];
const first=()=>STITCHES[st.mode][0].id;

// ---------- フォーム ----------
function buildItems(list,cont){
  const opts=STITCHES[st.mode].map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  list.forEach((it,ii)=>{
    if(it.rep!==undefined){
      const g=document.createElement('div'); g.className='group';
      g.innerHTML=`<div class="gh">繰り返し <input type="number" min="1" max="100" value="${it.rep}"> 回 <button class="b x" title="削除">✕</button></div><div class="gi"></div><button class="b">＋ 中に編み目を追加</button>`;
      g.querySelector('input').oninput=ev=>{it.rep=Math.max(1,Math.min(100,parseInt(ev.target.value)||1));update();};
      g.querySelector('.gh button').onclick=()=>{list.splice(ii,1);renderForm();};
      g.querySelector(':scope > button').onclick=()=>{it.items.push({t:first(),n:1});renderForm();};
      buildItems(it.items,g.querySelector('.gi'));
      cont.appendChild(g); return;
    }
    const e=document.createElement('div'); e.className='entry';
    e.innerHTML=`<select>${opts}</select><input type="number" min="1" max="200" value="${it.n}"><span>目</span><button class="b x" title="削除">✕</button>`;
    const sel=e.querySelector('select'); sel.value=byId(st.mode,it.t).id;
    sel.onchange=()=>{it.t=sel.value;update();};
    e.querySelector('input').oninput=ev=>{it.n=Math.max(1,Math.min(200,parseInt(ev.target.value)||1));update();};
    e.querySelector('button').onclick=()=>{list.splice(ii,1);renderForm();};
    cont.appendChild(e);
  });
}
function renderForm(){
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.mode));
  document.querySelectorAll('#layoutSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.layout));
  document.getElementById('ovalOpt').style.display=(st.layout==='oval'||st.layout==='bag')?'block':'none';
  document.getElementById('bagOpt').style.display=st.layout==='bag'?'block':'none';
  document.getElementById('ovalP').value=st.ovalP||'';
  document.getElementById('baseRows').value=st.baseRows||2;
  document.getElementById('memo').value=st.memo||'';
  document.getElementById('credit').value=st.credit||'';
  const box=document.getElementById('rows'); box.innerHTML='';
  const copts=COLORS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('');
  rows().forEach((r,ri)=>{
    const d=document.createElement('div'); d.className='row';
    d.innerHTML=`<h3><span class="ttl"></span> <span class="cnt"></span>
      <button class="b x" data-a="up" title="上へ">↑</button><button class="b x" data-a="down" title="下へ">↓</button>
      <button class="b x" data-a="dup" title="複製">⧉</button><button class="b x" data-a="del" title="削除">✕</button></h3>
      <div class="items"></div><button class="b" data-a="add">＋ 編み目を追加</button> <button class="b" data-a="addrep">＋ 繰り返しを追加</button>
      <div class="rowopt"><span>この段を <input type="number" class="times" min="1" max="200"> 段くりかえす</span><span>背景色 <select class="color">${copts}</select></span></div>`;
    buildItems(r.items,d.querySelector('.items'));
    const ti=d.querySelector('.times'); ti.value=r.times||1;
    ti.oninput=ev=>{r.times=Math.max(1,Math.min(200,parseInt(ev.target.value)||1));update();};
    const co=d.querySelector('.color'); co.value=r.color||'';
    co.onchange=()=>{r.color=co.value;update();};
    d.onclick=ev=>{
      const a=ev.target.dataset&&ev.target.dataset.a; if(!a) return;
      const L=rows();
      if(a==='add') r.items.push({t:first(),n:1});
      if(a==='addrep') r.items.push({rep:2,items:[{t:first(),n:1}]});
      if(a==='del') L.splice(ri,1);
      if(a==='dup') L.splice(ri+1,0,JSON.parse(JSON.stringify(r)));
      if(a==='up'&&ri>0) [L[ri-1],L[ri]]=[L[ri],L[ri-1]];
      if(a==='down'&&ri<L.length-1) [L[ri+1],L[ri]]=[L[ri],L[ri+1]];
      renderForm();
    };
    box.appendChild(d);
  });
  update();
}

// ---------- 展開 ----------
const expandList=l=>l.flatMap(it=>it.rep!==undefined?Array.from({length:it.rep},()=>expandList(it.items)).flat():Array.from({length:it.n},()=>byId(st.mode,it.t)));
const expand=r=>expandList(r.items);
// 「この段を○段くりかえす」を展開した、描画用の段リスト
function chartRows(){
  const out=[];
  rows().forEach((r,si)=>{
    const stt=expand(r); if(!stt.length) return;
    for(let k=0;k<Math.max(1,r.times||1);k++) out.push({st:stt,color:r.color||'',src:si});
  });
  return out;
}
const wrap=(p,cls='')=>`<svg xmlns="http://www.w3.org/2000/svg" class="${cls}" width="${p.w}" height="${p.h}" viewBox="0 0 ${p.w} ${p.h}" font-family="sans-serif"><rect width="${p.w}" height="${p.h}" fill="#fff"/>${p.o}</svg>`;
function chartSVG(){
  const C=chartRows();
  if(!C.length) return '<p style="color:#7a6f66;padding:30px">段を追加してください</p>';
  if(st.layout==='round') return roundSVG(C.map(c=>c.st));
  if(st.layout==='oval') return wrap(ovalParts(C.map(c=>c.st)));
  if(st.layout==='bag') return bagSVG(C);
  return wrap(flatParts(C,{}));
}

// ---------- 平編み(往復/側面) ----------
function flatParts(C,opt){
  const maxN=Math.max(...C.map(c=>c.st.length));
  const W=opt.W||38, k=Math.min(1,W/38), H=Math.round(44*Math.max(k,.72)), M=opt.M||46;
  const bw=maxN*W, w=bw+M*2, h=C.length*H+30; let o='';
  C.forEach((c,i)=>{
    const y=h-15-(i+0.5)*H, n=c.st.length, rtl=opt.allRtl||i%2===0, cx=w/2, num=(opt.num0||0)+i+1;
    if(c.color) o+=`<rect x="${M-6}" y="${y-H/2}" width="${bw+12}" height="${H}" fill="${c.color}"/>`;
    o+=`<line x1="${M-6}" x2="${w-M+6}" y1="${y+H/2}" y2="${y+H/2}" stroke="#e8e8e8"/>`;
    c.st.forEach((s,j)=>{
      const pos=rtl?(n-1)/2-j:j-(n-1)/2;
      o+=sym(s,`translate(${cx+pos*W},${y}) scale(${k.toFixed(2)})`);
    });
    const show=!opt.sparse||num===1||num%5===0||i===C.length-1;
    if(show){
      const lx=rtl?w-M+12:M-12;
      const t=opt.sparse?String(num):(rtl?num+'段 ←':'→ '+num+'段');
      o+=`<text x="${lx}" y="${y+4}" text-anchor="${rtl?'start':'end'}" font-size="12" fill="#555">${t}</text>`;
    }
  });
  return {w,h,o};
}

// ---------- 円形 ----------
function roundSVG(R){
  const ringH=42, sw=30; let prev=10; const rings=[];
  R.forEach(r=>{
    const n=r.length, rm=Math.max(prev+ringH/2, n*sw/(2*Math.PI));
    rings.push({rm,n,sc:Math.min(1,(2*Math.PI*rm/n)/32)}); prev=rm+ringH/2;
  });
  const Rmax=prev+10, size=Math.ceil(Rmax*2+70), c=size/2; let o='';
  rings.forEach((g,i)=>{
    o+=`<circle cx="${c}" cy="${c}" r="${g.rm+ringH/2}" fill="none" stroke="#eee"/>`;
    R[i].forEach((s,k)=>{
      const th=-Math.PI/2-2*Math.PI*(k+0.5)/g.n;
      const x=c+g.rm*Math.cos(th), y=c+g.rm*Math.sin(th), deg=th*180/Math.PI+90;
      o+=sym(s,`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${deg.toFixed(1)}) scale(${g.sc.toFixed(2)})`);
    });
  });
  rings.forEach((g,i)=>{
    o+=`<text x="${c+g.rm+ringH/2-2}" y="${c-4}" font-size="12" fill="#c4577a" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">${i+1}</text>`;
  });
  return wrap({w:size,h:size,o});
}

// ---------- 楕円(袋の底) ----------
function ovalParts(R){
  const sw=30, ringH=40, L1=R[0].length;
  const P=Math.max(1,st.ovalP||Math.max(1,L1-2)), a=P*sw, rings=R.slice(1);
  const b0=28, Bmax=(rings.length?b0+(rings.length-1)*ringH:0)+ringH/2;
  const w=Math.ceil(Math.max(a+2*Bmax,L1*sw)+90), h=Math.ceil(2*Bmax+90), cx=w/2, cy=h/2; let o='';
  R[0].forEach((s,k)=>{o+=sym(s,`translate(${cx-(L1-1)*sw/2+k*sw},${cy}) rotate(90)`);});
  o+=`<text x="${cx-L1*sw/2-6}" y="${cy+4}" font-size="12" fill="#c4577a" text-anchor="end">1</text>`;
  const f=n=>n.toFixed(1);
  rings.forEach((r,i)=>{
    const b=b0+i*ringH, B=b+ringH/2, N=r.length;
    const Pn=Math.min(P,Math.max(0,Math.floor((N-2)/2))), rest=N-2*Pn, e1=Math.ceil(rest/2), e2=rest-e1;
    o+=`<path d="M${f(cx-a/2)},${f(cy-B)} H${f(cx+a/2)} A${B},${B} 0 0 1 ${f(cx+a/2)},${f(cy+B)} H${f(cx-a/2)} A${B},${B} 0 0 1 ${f(cx-a/2)},${f(cy-B)}Z" fill="none" stroke="#eee"/>`;
    let idx=0;
    const put=(x,y,deg,sc)=>{o+=sym(r[idx++],`translate(${f(x)},${f(y)}) rotate(${f(deg)}) scale(${sc.toFixed(2)})`);};
    const sS=Pn?Math.min(1,a/Pn/32):1;
    for(let k=0;k<Pn;k++) put(cx+a/2-(k+.5)*a/Pn,cy-b,0,sS);
    for(let k=0;k<e1;k++){const p=(-90-180*(k+.5)/e1)*Math.PI/180; put(cx-a/2+b*Math.cos(p),cy+b*Math.sin(p),p*180/Math.PI+90,Math.min(1,Math.PI*b/e1/32));}
    for(let k=0;k<Pn;k++) put(cx-a/2+(k+.5)*a/Pn,cy+b,180,sS);
    for(let k=0;k<e2;k++){const p=(90-180*(k+.5)/e2)*Math.PI/180; put(cx+a/2+b*Math.cos(p),cy+b*Math.sin(p),p*180/Math.PI+90,Math.min(1,Math.PI*b/e2/32));}
  });
  rings.forEach((r,i)=>{const B=b0+i*ringH+ringH/2;
    o+=`<text x="${f(cx+a/2+B-2)}" y="${cy-4}" font-size="12" fill="#c4577a" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">${i+2}</text>`;});
  return {w,h,o};
}

// ---------- 袋物(底の楕円図 + 側面の平面図) ----------
function usedStitches(){
  const used=new Set(), walk=l=>l.forEach(it=>it.rep!==undefined?walk(it.items):used.add(byId(st.mode,it.t).id));
  rows().forEach(r=>walk(r.items));
  return STITCHES[st.mode].filter(s=>used.has(s.id));
}
function bagSVG(C){
  const K=Math.max(1,st.baseRows||2);
  const baseC=C.filter(c=>c.src<K), sideC=C.filter(c=>c.src>=K);
  const bp=baseC.length?ovalParts(baseC.map(c=>c.st)):{w:0,h:0,o:''};
  const maxN=sideC.length?Math.max(...sideC.map(c=>c.st.length)):0;
  const sp=sideC.length?flatParts(sideC,{W:Math.max(12,Math.min(26,Math.floor(800/maxN))),allRtl:true,sparse:true,num0:baseC.length,M:36}):{w:0,h:0,o:''};
  const used=usedStitches(), memo=(st.memo||'').split('\n').filter(x=>x.trim()!=='');
  const colW=Math.max(300,Math.min(bp.w,560)), sO=bp.w?Math.min(1,colW/bp.w):1;
  const legendH=used.length*26+16, memoH=memo.length*20+16, ovalH=bp.h*sO, chainN=baseC.length?baseC[0].st.length:0;
  const H=Math.ceil(Math.max(sp.h+24,16+legendH+memoH+ovalH+70)), x0=sp.w+16, W=Math.ceil(x0+colW+16);
  let o=`<g transform="translate(0,${H-sp.h-10})">${sp.o}</g>`;
  used.forEach((s,i)=>{const y=22+i*26;
    o+=sym(s,`translate(${x0+14},${y}) scale(.8)`)+`<text x="${x0+34}" y="${y+5}" font-size="13" fill="#222">${s.name}</text>`;});
  memo.forEach((t,i)=>{o+=`<text x="${x0+4}" y="${16+legendH+i*20+14}" font-size="13" fill="#222">${t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;});
  if(bp.w) o+=`<g transform="translate(${x0+(colW-bp.w*sO)/2},${H-ovalH-34}) scale(${sO.toFixed(3)})">${bp.o}</g>`;
  if(chainN) o+=`<text x="${x0+colW/2}" y="${H-22}" font-size="12" fill="#555" text-anchor="middle">鎖${chainN}目作る</text>`;
  if(st.credit) o+=`<text x="${W-12}" y="${H-6}" font-size="12" fill="#555" text-anchor="end">${st.credit.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;
  return wrap({w:W,h:H,o},'fit');
}

// ---------- 凡例・文章レシピ ----------
function update(){
  document.getElementById('chartWrap').innerHTML=chartSVG();
  const used=new Set(), rec=[]; let num=1;
  rows().forEach((r,i)=>{
    const tx=l=>l.map(it=>{
      if(it.rep!==undefined) return `(${tx(it.items).join('、')})を${it.rep}回`;
      const s=byId(st.mode,it.t); used.add(s.id); return `${s.name}${it.n}目`;});
    const parts=tx(r.items), total=expand(r).reduce((x,s)=>x+s.out,0), t=Math.max(1,r.times||1);
    const label=t>1?`${num}〜${num+t-1}段目`:`${num}段目`;
    if(total) num+=t;
    rec.push(`<li><b>${label}</b>：${parts.join('、')||'—'}</li>`);
    const c=document.querySelectorAll('#rows .row .cnt')[i]; if(c) c.textContent=`（${total}目）`;
    const ttl=document.querySelectorAll('#rows .row .ttl')[i]; if(ttl) ttl.textContent=label;
  });
  document.getElementById('recipe').innerHTML=rec.join('');
  document.getElementById('legend').innerHTML=st.layout==='bag'?'':STITCHES[st.mode].filter(s=>used.has(s.id))
    .map(s=>`<span><svg width="26" height="30" viewBox="-13 -15 26 30">${sym(s,'')}</svg>${s.name}</span>`).join('');
  save();
}

// ---------- イベント ----------
document.getElementById('modeSeg').onclick=e=>{if(e.target.dataset.v){st.mode=e.target.dataset.v;renderForm();}};
document.getElementById('layoutSeg').onclick=e=>{if(e.target.dataset.v){st.layout=e.target.dataset.v;renderForm();}};
document.getElementById('ovalP').oninput=e=>{st.ovalP=parseInt(e.target.value)||null;update();};
document.getElementById('baseRows').oninput=e=>{st.baseRows=Math.max(1,parseInt(e.target.value)||2);update();};
document.getElementById('memo').oninput=e=>{st.memo=e.target.value;update();};
document.getElementById('credit').oninput=e=>{st.credit=e.target.value;update();};
document.getElementById('bagPreset').onclick=()=>{
  const v=prompt('作り目の鎖の目数は？(例: 24)','24'); if(v===null) return;
  const L=Math.max(3,Math.min(100,parseInt(v)||24));
  st.mode='crochet';
  const total=2*(L-2)+6;
  st.data.crochet=[{items:[{t:'chain',n:L}]},{items:[{t:'sc',n:L-2},{t:'sc',n:3},{t:'sc',n:L-2},{t:'sc',n:3}]}];
  if(st.layout==='bag') st.data.crochet.push({items:[{t:'sc',n:total}],times:10});
  st.ovalP=null; st.baseRows=2; renderForm();
};
document.getElementById('addRow').onclick=()=>{
  const L=rows(), last=L[L.length-1];
  L.push(last?JSON.parse(JSON.stringify(last)):{items:[{t:first(),n:6}]});
  renderForm();
};
document.getElementById('reset').onclick=()=>{ if(confirm('すべての編み図を初期状態に戻しますか?')){st=defaults();renderForm();} };
document.getElementById('png').onclick=()=>{
  const svg=document.querySelector('#chartWrap svg'); if(!svg) return;
  const w=+svg.getAttribute('width'), h=+svg.getAttribute('height'), k=2;
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=w*k; cv.height=h*k;
    const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height);
    const a=document.createElement('a'); a.download='amizu.png'; a.href=cv.toDataURL('image/png'); a.click();
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));
};
renderForm();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
